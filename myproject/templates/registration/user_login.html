<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>ログイン画面</title>
    </head>
    
    <body>
        <h2>ログイン画面</h2>
        <form method="POST">
            {% csrf_token %}

            <label for="id_username">ユーザー名</label>
            {{ form.username }}
            </br>

            <label for="id_password1">パスワード</label>
            {{ form.password }}
            </br>

            <button type="submit">ログインする</button>
        </form>
    </body>
</html>
