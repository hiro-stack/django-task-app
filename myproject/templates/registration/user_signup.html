<!-- user_signup.html -->
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ユーザー登録</title>
</head>
<body>
    <h2>ユーザー登録画面</h2>
    <form method="POST">
        {% csrf_token %}
        
        <label for="id_username">ユーザー名</label>
        {{ form.username }}
        <br>

        <label for="id_email">メールアドレス</label>
        {{ form.email }}
        <br>

        <label for="id_password1">パスワード</label>
        {{ form.password1 }}
        <br>

        <label for="id_password2">パスワード確認</label>
        {{ form.password2 }}
        <br>

        <button type="submit">登録する</button>
        <!-- エラーメッセージを表示 -->
        {% if form.errors %}
            <ul>
                {% for field in form %}
                    {% for error in field.errors %}
                        <li>{{ error }}</li>
                    {% endfor %}
                {% endfor %}
            </ul>
        {% endif %}
    </form>
</body>
</html>
