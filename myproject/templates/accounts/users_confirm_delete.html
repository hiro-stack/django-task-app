<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ユーザー削除確認画面</title>
</head>
<body>
    <h2>ユーザー削除確認</h2>

  <p>本当に {{ user.username }} ユーザーを削除しますか？</p>
  
  <form method="post">
    {% csrf_token %}
    <button type="submit">削除する</button>
  </form>
  
  <br>
  <a href="{% url 'user:users_list' %}">戻る</a>
    
</body>
</html>
